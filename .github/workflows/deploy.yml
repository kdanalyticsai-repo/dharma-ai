name: Build & Deploy DharmaAI

on:
  push:
    branches: [main]

jobs:
  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy OpenAI proxy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare_worker
          secrets: |
            OPENAI_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  build-web:
    name: Build & Deploy Web App
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Create dart defines file
        # Using --dart-define-from-file avoids shell escaping issues with
        # JWT tokens (dots, plus signs, equals) that break --dart-define.
        # NOTE: OPENAI_API_KEY is intentionally excluded — it would be
        # embedded in the JS bundle. OpenAI calls go through the Worker.
        run: |
          cat > dart_defines.json << 'EOF'
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}",
            "OPENAI_WORKER_URL": "${{ secrets.OPENAI_WORKER_URL }}",
            "R2_BUCKET_URL": "${{ secrets.R2_BUCKET_URL }}"
          }
          EOF

      - name: Build web
        run: flutter build web --dart-define-from-file=dart_defines.json --base-href=/dharma-ai/

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler-web.toml
