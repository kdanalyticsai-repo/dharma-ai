name: Build & Deploy DharmaAI

on:
  push:
    branches: [main]

jobs:
  deploy-worker:
    name: Deploy Cloudflare Worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy OpenAI proxy worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: cloudflare_worker
          secrets: |
            OPENAI_API_KEY
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}

  build-web:
    name: Build & Deploy Web App
    runs-on: ubuntu-latest
    needs: deploy-worker
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.0'

      - name: Install dependencies
        run: flutter pub get

      - name: Build web
        # NOTE: do NOT pass OPENAI_API_KEY here — --dart-define values are
        # embedded in the shipped web bundle. OpenAI calls go through the
        # Cloudflare Worker (OPENAI_WORKER_URL) which holds the key server-side.
        run: |
          flutter build web \
            --dart-define=R2_BUCKET_URL=${{ secrets.R2_BUCKET_URL }} \
            --dart-define=OPENAI_WORKER_URL=${{ secrets.OPENAI_WORKER_URL }} \
            --dart-define=SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
            --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: dharma-ai
          directory: build/web
