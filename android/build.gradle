allprojects {
    repositories {
        google()
        mavenCentral()
    }
    // Force kotlin-stdlib to match our KGP version (2.2.20).
    // Some plugins (e.g. package_info_plus 9.0.1) declare stdlib 2.2.0 in their own buildscript,
    // which Kotlin 2.1.x cannot read. Forcing here prevents the version mismatch.
    configurations.all {
        resolutionStrategy {
            force "org.jetbrains.kotlin:kotlin-stdlib:2.2.20"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:2.2.20"
            force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:2.2.20"
            force "org.jetbrains.kotlin:kotlin-stdlib-common:2.2.20"
        }
    }
}

// Expose flutter SDK constants to plugin subprojects that use flutter.compileSdkVersion etc.
// Excludes :app which uses the real FlutterExtension from dev.flutter.flutter-gradle-plugin.
subprojects {
    if (project.name != 'app') {
        project.ext {
            flutter = [compileSdkVersion: 36, minSdkVersion: 23, targetSdkVersion: 35, ndkVersion: "27.0.12077973"]
        }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
}
subprojects {
    project.evaluationDependsOn(":app")
}

// sentry_flutter (and others) set languageVersion="1.6" which Kotlin 2.2.20 dropped.
// gradle.projectsEvaluated fires after ALL projects are done — avoids "already evaluated" error.
gradle.projectsEvaluated {
    subprojects {
        tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).each { task ->
            task.kotlinOptions.languageVersion = '2.0'
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
