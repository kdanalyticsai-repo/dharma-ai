name = "dharma-ai"
main = "dharma_ai_proxy.js"
compatibility_date = "2024-01-01"

# Secrets (never put real values here — set in Cloudflare dashboard or via CLI):
#   Dashboard: Settings → Variables and Secrets → Add secret → OPENAI_API_KEY
#   CLI: wrangler secret put OPENAI_API_KEY
#
# Worker URL: https://dharma-ai.kdanalyticsai.workers.dev
# Set this as OPENAI_WORKER_URL in GitHub Secrets for CI.

[vars]
# Comma-separated list of allowed request origins (no spaces).
# Add your prod domain here. localhost entry is for local wrangler dev.
ALLOWED_ORIGINS = "http://localhost:3456,https://dharmaai.kdaanalytics.com,https://apps.kdaanalytics.com,https://dharma-ai-web.kdanalyticsai.workers.dev,https://dharma.kdaanalytics.com"

# KV namespace for the per-user daily AI rate limit (abuse backstop).
# 1. Create it once:   npx wrangler kv namespace create AI_RATE_LIMIT
# 2. Paste the printed id below, then deploy.
# Until a real id is set, the Worker fails OPEN (no rate limit) — AI still works.
[[kv_namespaces]]
binding = "AI_RATE_LIMIT"
id = "PASTE_KV_NAMESPACE_ID_HERE"
