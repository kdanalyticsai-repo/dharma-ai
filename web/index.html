<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="DharmaAI — Bhagavad Gita reader, AI spiritual guidance and sadhana tracker.">

  <!-- Opt out of browser/OS forced dark mode (e.g. Chrome Android "Auto Dark
       Theme"). The app manages its own designed light palette, so the browser
       must not invert/darken text and surfaces. -->
  <meta name="color-scheme" content="light">
  <style>
    :root { color-scheme: only light; }
    html, body { background-color: #FFF8F6; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="dharma">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>dharma</title>
  <link rel="manifest" href="manifest.json">

  <!-- Razorpay Checkout (web payments). Bridge lets Dart open the checkout. -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.dharmaOpenRazorpay = function (optionsJson, onSuccess, onFailure) {
      try {
        var o = JSON.parse(optionsJson);
        var rzp = new Razorpay({
          key: o.key_id,
          order_id: o.order_id,
          amount: o.amount,
          currency: o.currency,
          name: 'DharmaAI',
          description: o.plan_label || 'Sadhaka Membership',
          prefill: { email: o.email || '', name: o.name || '' },
          theme: { color: '#CC5500' },
          handler: function (resp) {
            onSuccess(resp.razorpay_payment_id, resp.razorpay_order_id, resp.razorpay_signature);
          },
          modal: { ondismiss: function () { onFailure('dismissed'); } }
        });
        rzp.on('payment.failed', function (resp) {
          onFailure((resp.error && resp.error.description) || 'payment_failed');
        });
        rzp.open();
      } catch (e) {
        onFailure('init_error: ' + e.message);
      }
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
