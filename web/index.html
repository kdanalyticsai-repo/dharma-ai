<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- Google Search Console verification -->
  <meta name="google-site-verification" content="kJYgK1gF58kTqMzRbT9Lw0NbBAUbM-IeI1E7GMD4wEo">
  <meta name="description" content="DharmaAI — your companion on the path of wisdom. Read the Bhagavad Gita, Vedas and Upanishads, receive personalised AI spiritual guidance, and track your daily sadhana.">
  <meta name="theme-color" content="#FAF7F2">
  <link rel="canonical" href="https://dharma.kdaanalytics.com/">

  <!-- Open Graph (WhatsApp, Facebook, LinkedIn link previews) -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="DharmaAI">
  <meta property="og:title" content="DharmaAI — Bhagavad Gita, AI Guidance & Sadhana">
  <meta property="og:description" content="Read the Bhagavad Gita, Vedas and Upanishads, receive personalised AI spiritual guidance, and track your daily sadhana.">
  <meta property="og:url" content="https://dharma.kdaanalytics.com/">
  <meta property="og:image" content="https://dharma.kdaanalytics.com/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Twitter / X card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="DharmaAI — Bhagavad Gita, AI Guidance & Sadhana">
  <meta name="twitter:description" content="Read the Bhagavad Gita, Vedas and Upanishads, receive personalised AI spiritual guidance, and track your daily sadhana.">
  <meta name="twitter:image" content="https://dharma.kdaanalytics.com/og-image.png">

  <!-- Opt out of browser/OS forced dark mode (e.g. Chrome Android "Auto Dark
       Theme"). The app manages its own designed light palette, so the browser
       must not invert/darken text and surfaces. -->
  <meta name="color-scheme" content="light">
  <style>
    :root { color-scheme: only light; }
    html, body { background-color: #FFF8F6; }
  </style>

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="DharmaAI">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>DharmaAI — Bhagavad Gita, AI Spiritual Guidance & Sadhana Tracker</title>
  <link rel="manifest" href="manifest.json">

  <!-- Razorpay Checkout (web payments). Bridge lets Dart open the checkout. -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.dharmaOpenRazorpay = function (optionsJson, onSuccess, onFailure) {
      try {
        var o = JSON.parse(optionsJson);
        var rzp = new Razorpay({
          key: o.key_id,
          order_id: o.order_id,
          amount: o.amount,
          currency: o.currency,
          name: 'DharmaAI',
          description: o.plan_label || 'Sadhaka Membership',
          prefill: { email: o.email || '', name: o.name || '' },
          theme: { color: '#CC5500' },
          handler: function (resp) {
            onSuccess(resp.razorpay_payment_id, resp.razorpay_order_id, resp.razorpay_signature);
          },
          modal: { ondismiss: function () { onFailure('dismissed'); } }
        });
        rzp.on('payment.failed', function (resp) {
          onFailure((resp.error && resp.error.description) || 'payment_failed');
        });
        rzp.open();
      } catch (e) {
        onFailure('init_error: ' + e.message);
      }
    };
  </script>
</head>
<body>
  <!-- When a new build's service worker activates, reload once so users always
       land on the latest version (prevents getting stuck on a stale build).
       Guarded against reload loops; skips the very first install. -->
  <script>
    if ('serviceWorker' in navigator) {
      var __hadController = !!navigator.serviceWorker.controller;
      var __refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (__refreshing || !__hadController) return; // first install → no reload
        __refreshing = true;
        window.location.reload();
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
