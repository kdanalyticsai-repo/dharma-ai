  <!-- In-app browser (Facebook, Instagram, LinkedIn, WhatsApp, TikTok …) detection.
       These embedded WebViews block PWA install and can break Flutter internals.
       We show a plain-HTML banner BEFORE Flutter boots so the message appears even
       if the app fails to load in those environments. -->
  <style>
    #_dharma-iab-bar {
      display: none;
      position: fixed; top: 0; left: 0; right: 0; z-index: 99999;
      background: #9C3F00; color: #fff;
      padding: 13px 44px 13px 16px;
      text-align: center; font-size: 14px; font-weight: 600; line-height: 1.5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    #_dharma-iab-bar button {
      position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
      background: transparent; border: none; color: #fff;
      font-size: 22px; line-height: 1; cursor: pointer; padding: 4px;
    }
  </style>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isIOS = /iPhone|iPad|iPod/.test(ua);
      var isIAB = /FBAN|FBAV|FBIOS|FBBV|Instagram|LinkedInApp|Twitter(?:\/| for)|WhatsApp|MicroMessenger|musical_ly|BytedanceWebview|TikTok|Snapchat|Pinterest/i.test(ua);
      if (!isIAB) return;
      var msg = isIOS
        ? '📲 For best experience: tap ··· (Share) → "Open in Safari"'
        : '📲 For best experience: tap ⋮ → "Open in browser" or "Open in Chrome"';
      // Inject the banner as soon as the DOM is ready
      function showBar() {
        var bar = document.getElementById('_dharma-iab-bar');
        if (bar) { bar.querySelector('span').textContent = msg; bar.style.display = 'block'; }
      }
      if (document.body) { showBar(); }
      else { document.addEventListener('DOMContentLoaded', showBar); }
    })();
  </script>

  <!-- Guard document.createEvent against browser extension wrappers that lose 'this'
       or return null/undefined instead of a real Event object.
       Extensions that run at document_start patch Document.prototype BEFORE any page
       script, so capturing the prototype here gives us the extension's broken version.
       Fix: create a hidden iframe — its Document.prototype lives in a separate JS realm
       that extensions do NOT patch — and use that as the truly native implementation.
       (Sentry DHARMA-AI-5: Illegal invocation; DHARMA-AI-6: NoSuchMethodError null check) -->
  <script>
    (function() {
      try {
        // Step 1: get the truly native createEvent from a fresh, unpatched iframe realm.
        var _if = document.createElement('iframe');
        _if.style.cssText = 'display:none;position:absolute;width:0;height:0';
        document.documentElement.appendChild(_if);
        var _native = null;
        try { _native = _if.contentWindow.Document.prototype.createEvent; } catch (_e) {}
        document.documentElement.removeChild(_if);

        // Step 2: fall back to current prototype if iframe trick failed (cross-origin block etc.).
        if (typeof _native !== 'function') {
          _native = Document.prototype.createEvent;
        }

        // Step 3: set an own property on the document instance so it always shadows any
        // prototype-level patch. The bound call guarantees correct 'this' (document).
        var _create = _native.bind(document);
        Object.defineProperty(document, 'createEvent', {
          value: function createEvent(type) { return _create(type); },
          writable: true,
          configurable: true,
          enumerable: true,
        });
      } catch (_) {}
    })();
  </script>

  <!-- CanvasKit / WebGL crash recovery.
       When the browser loses the WebGL context (GPU memory pressure, tab
       switching, device sleep) the CanvasKit WASM module aborts with
       "RuntimeError: Aborted()". Flutter cannot recover from this on its own,
       so we reload the page after a short delay to give the user a clean session
       instead of a frozen white screen. -->
  <script>
    (function() {
      var _reloading = false;
      function recoverCanvasKit(reason) {
        if (_reloading) return;
        _reloading = true;
        console.warn('DharmaAI: ' + reason + ' — reloading for recovery');
        setTimeout(function() { window.location.reload(); }, 1500);
      }
      // Catch the Emscripten/WASM abort that surfaces as a JS error.
      window.addEventListener('error', function(e) {
        if (e && e.message && e.message.indexOf('Aborted') !== -1) {
          recoverCanvasKit('CanvasKit WASM abort');
        }
      });
      // Catch WebGL context loss before it reaches CanvasKit.
      window.addEventListener('webglcontextlost', function(e) {
        e.preventDefault();
        recoverCanvasKit('WebGL context lost');
      }, true);
    })();
  </script>

  <!-- PWA install prompt bridge: captures the browser's beforeinstallprompt
       event so Flutter can trigger a native "Add to Home Screen" install.
       Fires on Android Chrome when the app meets PWA criteria (manifest +
       service worker + HTTPS). iOS uses "Share → Add to Home Screen" manually. -->
  <script>
    window._dharmaIsInstallable = false;
    window._dharmaInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window._dharmaInstallPrompt = e;
      window._dharmaIsInstallable = true;
    });
    window.addEventListener('appinstalled', function() {
      window._dharmaIsInstallable = false;
      window._dharmaInstallPrompt = null;
    });
    window.dharmaInstallPWA = function() {
      if (!window._dharmaInstallPrompt) return;
      window._dharmaInstallPrompt.prompt();
      window._dharmaInstallPrompt.userChoice.then(function(result) {
        if (result.outcome === 'accepted') {
          window._dharmaIsInstallable = false;
          window._dharmaInstallPrompt = null;
        }
      });
    };
  </script>

  <!-- Razorpay Checkout (web payments). Bridge lets Dart open the checkout. -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
  <script>
    window.dharmaOpenRazorpay = function (optionsJson, onSuccess, onFailure) {
      try {
        var o = JSON.parse(optionsJson);
        var rzp = new Razorpay({
          key: o.key_id,
          order_id: o.order_id,
          amount: o.amount,
          currency: o.currency,
          name: 'DharmaAI',
          description: o.plan_label || 'Sadhaka Membership',
          prefill: { email: o.email || '', name: o.name || '' },
          theme: { color: '#CC5500' },
          handler: function (resp) {
            onSuccess(resp.razorpay_payment_id, resp.razorpay_order_id, resp.razorpay_signature);
          },
          modal: { ondismiss: function () { onFailure('dismissed'); } }
        });
        rzp.on('payment.failed', function (resp) {
          onFailure((resp.error && resp.error.description) || 'payment_failed');
        });
        rzp.open();
      } catch (e) {
        onFailure('init_error: ' + e.message);
      }
    };
  </script>

<body>
  <!-- In-app browser banner (shown by the detection script above) -->
  <div id="_dharma-iab-bar">
    <span></span>
    <button onclick="document.getElementById('_dharma-iab-bar').style.display='none'" aria-label="Dismiss">&times;</button>
  </div>

  <!-- When a new build's service worker activates, reload once so users always
       land on the latest version (prevents getting stuck on a stale build).
       Guarded against reload loops; skips the very first install. -->
  <script>
    if ('serviceWorker' in navigator) {
      var __hadController = !!navigator.serviceWorker.controller;
      var __refreshing = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (__refreshing || !__hadController) return; // first install → no reload
        __refreshing = true;
        window.location.reload();
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
