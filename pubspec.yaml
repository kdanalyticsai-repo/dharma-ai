name: dharma_ai
description: "A Sacred & Serene AI Scripture Reader and Spiritual Companion mobile app."
version: 1.0.0+9

publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.9

  # Backend & Database
  supabase_flutter: ^2.3.3
  hive_flutter: ^1.1.0

  # Navigation
  go_router: ^12.1.3

  # UI & Design System
  google_fonts: ^8.0.0
  flutter_svg: ^2.0.9

  # Audio Wisdom
  just_audio: ^0.9.36
  audio_service: ^0.18.12

  # HTTP client (Gemini API)
  http: ^1.2.0

  # Observability
  sentry_flutter: ^8.9.0   # production error/crash monitoring (DSN via dart-define)
  firebase_core: ^3.6.0    # required by firebase_analytics
  firebase_analytics: ^11.3.3   # cross-platform analytics (web + Android)

  # Utility
  share_plus: ^10.1.1   # share branded verse images to social / WhatsApp
  shared_preferences: ^2.2.2
  path_provider: ^2.1.1
  crypto: ^3.0.3   # SHA-256 for privacy-preserving Q&A cache keys
  url_launcher: ^6.2.5   # open temple credit links (Audio Wisdom)
  google_sign_in: ^6.2.0   # native Google Sign-In for Android
  app_links: ^6.4.0        # intercept HTTPS App Links on Android (auth deep links)
  in_app_purchase: ^3.3.0          # Google Play Billing for Android (Billing Library 7+)
  in_app_purchase_android: ^0.5.1  # Access GooglePlayPurchaseDetails.purchaseToken

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  hive_generator: ^2.0.1
  build_runner: ^2.4.8
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/mandalas/
    - assets/audio/

  # Fonts can also be defined here if they are bundled locally,
  # but google_fonts package fetches them dynamically and caches them.

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/dharma_logo_mobile.png"
  adaptive_icon_background: "#1A0A00"
  adaptive_icon_foreground: "assets/images/dharma_logo_mobile.png"
  min_sdk_android: 23

flutter_native_splash:
  color: "#1A0A00"
  image: assets/images/dharma_logo_mobile.png
  android: true
  ios: false
  web: false
  android_12:
    image: assets/images/dharma_logo_mobile.png
    color: "#1A0A00"
